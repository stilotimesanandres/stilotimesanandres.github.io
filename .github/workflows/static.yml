<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STILO-TIME 2026 | Modistería & Folclor</title>
    <style>
        :root {
            --primary: #1b4d3e;
            --secondary: #d4af37;
            --dark: #111111;
            --light: #f9f9f9;
            --accent: #e63946;
            --whatsapp-color: #25d366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
        header { background: linear-gradient(135deg, var(--dark), var(--primary)); color: white; padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--secondary); position: relative; }
        .logo-container img { max-width: 180px; border-radius: 50%; border: 3px solid var(--secondary); box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 15px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; color: var(--secondary); margin-bottom: 5px; }
        header p { font-style: italic; font-size: 1.1rem; opacity: 0.9; }
        .location-badge { display: inline-block; background-color: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; margin-top: 10px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.2); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 2rem; color: var(--primary); text-align: center; margin-bottom: 30px; position: relative; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .section-title::after { content: ''; width: 80px; height: 4px; background-color: var(--secondary); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        
        /* Grid de Ropa */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: transform 0.3s; border: 1px solid #eee; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); }
        .product-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; padding: 10px; background: #f0f0f0; }
        .product-gallery img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .product-gallery img:hover { opacity: 0.9; }
        .product-gallery img.full-width { grid-column: span 2; height: 220px; }
        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-info h3 { font-size: 1.25rem; color: var(--primary); margin-bottom: 10px; }
        .product-info p { font-size: 0.9rem; color: #555; margin-bottom: 15px; flex-grow: 1; }
        .price-tag { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: linear-gradient(90deg, #fdf9ec, #fff); border-left: 4px solid var(--secondary); border-radius: 0 8px 8px 0; }
        .price-detal { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        .price-mayor { font-weight: bold; color: var(--primary); font-size: 1rem; }
        .tallas { font-size: 0.85rem; color: #777; margin-bottom: 15px; }
        
        /* Botones */
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; background-color: var(--whatsapp-color); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; transition: background 0.3s; gap: 8px; text-align: center; }
        .btn-whatsapp:hover { background-color: #20ba56; }
        
        /* Sección Música */
        .music-section { background: linear-gradient(rgba(27, 77, 62, 0.9), rgba(17, 17, 17, 0.95)), url('image_29784_.png') no-repeat center center/cover; color: white; padding: 60px 20px; border-radius: 16px; margin-bottom: 60px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .music-section .section-title { color: white; }
        .music-intro { text-align: center; max-width: 800px; margin: 0 auto 40px; }
        .music-intro p { font-size: 1.1rem; margin-bottom: 20px; }
        .arsenal-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .arsenal-item { background: rgba(255,255,255,0.15); padding: 6px 15px; border-radius: 20px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Galería Música */
        .music-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .music-gallery img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); transition: transform 0.3s; }
        .music-gallery img:hover { transform: scale(1.03); border-color: var(--secondary); }
        
        /* Videos de Facebook */
        .videos-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .video-card { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .video-card p { font-size: 0.9rem; color: var(--secondary); margin-bottom: 12px; font-weight: bold; }
        .btn-video { display: inline-flex; align-items: center; justify-content: center; background-color: #1877f2; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; transition: background 0.3s; width: 100%; }
        .btn-video:hover { background-color: #166fe5; }
        
        /* Flotante contacto */
        .sticky-contact { text-align: center; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid var(--secondary); }
        .sticky-contact h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.5rem; }
        .sticky-contact p { margin-bottom: 20px; color: #555; }
        .sticky-contact .btn-whatsapp { max-width: 320px; margin: 0 auto; font-size: 1.2rem; }
        
        footer { background-color: var(--dark); color: #888; text-align: center; padding: 30px 20px; border-top: 3px solid var(--primary); font-size: 0.9rem; margin-top: 60px; }
        footer strong { color: var(--secondary); }

        @media(max-width: 768px) {
            header h1 { font-size: 2rem; }
            .product-gallery img { height: 130px; }
            .product-gallery img.full-width { height: 180px; }
        }
    </style>
</head>
